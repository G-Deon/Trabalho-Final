<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="E-commerce - Login" />
    <title>E-commerce - Login</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <nav>
        <div class="container">
          <h1>E-commerce</h1>
          <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="produtos.html">Produtos</a></li>
            <li><a href="sacola.html">Sacola</a></li>
            <li><a href="login.html">Login</a></li>
          </ul>
        </div>
      </nav>
    </header>

    <main>
      <section class="container">
        <div class="login-container">
          <h2>Login</h2>
          <p>Entre com seu e-mail para acessar sua sacola</p>

          <form id="loginForm" class="form">
            <div class="form-group">
              <label for="email">E-mail:</label>
              <input
                type="email"
                id="email"
                name="email"
                required
                placeholder="seu@email.com"
                aria-required="true"
              />
            </div>

            <div id="error" class="error" style="display: none"></div>
            <div id="success" class="success" style="display: none"></div>

            <button type="submit" class="btn" id="loginButton">Entrar</button>
          </form>
        </div>
      </section>
    </main>

    <footer>
      <div class="container">
        <p>&copy; 2025 E-commerce. Todos os direitos reservados.</p>
      </div>
    </footer>

    <script src="js/auth.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script src="js/login.js"></script>
  </body>
</html>
